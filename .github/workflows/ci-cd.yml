# ==============================================================
# Jerney - DevSecOps CI/CD Pipeline
# ==============================================================
# Triggers on every push and pull request.
#
# Flow:
#   1. Secret Scan (Gitleaks)
#   2. Lint (ESLint)                 ─┐
#   3. SAST (SonarQube + Quality Gate)│  run in parallel after secret scan
#   4. SCA (npm audit + Trivy fs)    │
#   5. Dockerfile Lint (Hadolint)    │
#   6. IaC Scan (Checkov)            ─┘
#   7. Build, Push, SBOM, Sign (Cosign)
#   8. Image Scan (Dockle CIS benchmark + Trivy vulnerabilities)
#   9. Update K8s Manifest (devops branch only)
#
# Required repo secrets:
#   SONAR_TOKEN      - SonarQube user/project token
#   SONAR_HOST_URL   - e.g. http://<sonarqube-ip>:9000
# GITHUB_TOKEN is provided automatically.
# ==============================================================

name: Jerney DevSecOps Pipeline

on:
  push:
    branches: ["**"] # "**" also matches branches with slashes (feature/x)
  pull_request:
    branches: ["**"]

# Security: restrict default permissions to read-only
permissions:
  contents: read

# Cancel older runs of the same branch so two runs never race on the manifest
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io
  NODE_VERSION: "20"

jobs:
  # ==============================================================
  # STAGE 0: Secret Scanning (Gitleaks)
  # Scans full git history for hardcoded keys, tokens, passwords
  # ==============================================================
  secret-scan:
    name: "🔑 Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only needed for org-owned repos

  # ==============================================================
  # STAGE 1: Linting
  # ==============================================================
  lint:
    name: "🔍 Lint Code"
    runs-on: ubuntu-latest
    needs: secret-scan
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.component }}
        run: npm run lint

  # ==============================================================
  # STAGE 1b: SAST — SonarQube Analysis + Quality Gate
  # ==============================================================
  sast-sonarqube:
    name: "🧪 SAST (SonarQube)"
    runs-on: ubuntu-latest
    needs: secret-scan
    # Fork PRs don't receive secrets, so skip them instead of failing
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code (full history for blame/new-code detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Jerney-app
            -Dsonar.projectName=Jerney-app
            -Dsonar.sources=backend,frontend
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ==============================================================
  # STAGE 2: Software Composition Analysis (SCA) — Dependency Audit
  # ==============================================================
  sca:
    name: "🛡️ Dependency Audit"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      # npm audit for known vulnerabilities (fail on high/critical)
      - name: npm audit
        working-directory: ${{ matrix.component }}
        run: npm audit --audit-level=high || true
        # `|| true` to not fail on moderate — adjust in prod

      # Trivy filesystem scan: dependency vulns + leaked secrets
      # (Dockerfile/K8s/Terraform misconfig is covered by Hadolint + Checkov)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./${{ matrix.component }}"
          scanners: "vuln,secret"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ==============================================================
  # STAGE 3: Build & Push Container Images (+ SBOM, provenance, signing)
  # Gated on all code-level security checks
  # ==============================================================
  build:
    name: "🐳 Build ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: [sca, sast-sonarqube, dockerfile-lint, iac-scan]
    # Run when nothing failed; still runs if SonarQube was skipped (fork PRs)
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write # Needed to push to GHCR
      id-token: write # Needed for keyless Cosign signing
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Security: provenance and SBOM
          provenance: true
          sbom: true

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, by digest)
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/jerney-${{ matrix.component }}"
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  # ==============================================================
  # STAGE 4: Container Image Scanning (Dockle + Trivy)
  # On push: scans the exact image pushed to GHCR.
  # On PR: builds locally (nothing was pushed) and scans that.
  # ==============================================================
  image-scan:
    name: "🔬 Scan ${{ matrix.component }} Image"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=jerney-${{ matrix.component }}:scan" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/jerney-${{ matrix.component }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR (pull pushed image)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning (PR only)
        if: github.event_name == 'pull_request'
        run: docker build -t ${{ steps.ref.outputs.image }} ./${{ matrix.component }}

      - name: Pull pushed image (push only)
        if: github.event_name != 'pull_request'
        run: docker pull ${{ steps.ref.outputs.image }}

      # Dockle: CIS Docker Benchmark + best-practice checks on the built image
      # (root user, secrets in ENV, setuid files, missing HEALTHCHECK, etc.)
      - name: Run Dockle image linter
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15 \
            --exit-code 1 \
            --exit-level fatal \
            ${{ steps.ref.outputs.image }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "10m"

  # ==============================================================
  # STAGE 5: IaC Security Scan (Checkov) — Terraform + K8s
  # ==============================================================
  iac-scan:
    name: "🏗️ IaC Security Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          skip_check: CKV_AWS_39,CKV_AWS_58 # Public EKS endpoint (intentional for dev)
          output_format: cli

      - name: Run Checkov on Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true # Soft fail for K8s (some checks may not apply)
          output_format: cli

  # ==============================================================
  # STAGE 6: Dockerfile Lint (Hadolint)
  # ==============================================================
  dockerfile-lint:
    name: "📋 Dockerfile Lint"
    runs-on: ubuntu-latest
    needs: secret-scan
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: warning

  # ==============================================================
  # STAGE 7: Update K8s Manifest with New Image Tag
  # Only runs on push to devops (the DevSecOps branch), AFTER images are built and scanned
  # ==============================================================
  update-manifest:
    name: "🚀 Update K8s Manifest"
    runs-on: ubuntu-latest
    needs: [build, image-scan]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/devops' }}
    permissions:
      contents: write # Needed to push manifest changes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag and names
        id: vars
        run: |
          # Same 7-char SHA that docker/metadata-action used for the tag
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # GHCR requires lowercase repository paths
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Update K8s manifest with new image tags
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          BACKEND_IMAGE: ${{ steps.vars.outputs.prefix }}/jerney-backend
          FRONTEND_IMAGE: ${{ steps.vars.outputs.prefix }}/jerney-frontend
        run: |
          set -euo pipefail

          # Find the image: line right after `- name: backend`
          BACKEND_LINE=$(awk '/- name: backend/{found=1} found && /image:/{print NR; exit}' k8s/jerney.yaml)
          [ -n "$BACKEND_LINE" ] || { echo "❌ backend image line not found"; exit 1; }
          echo "Backend image at line: ${BACKEND_LINE}"
          sed -i "${BACKEND_LINE}s|.*|          image: ${BACKEND_IMAGE}:${IMAGE_TAG}|" k8s/jerney.yaml

          # Find the image: line right after `- name: frontend`
          FRONTEND_LINE=$(awk '/- name: frontend/{found=1} found && /image:/{print NR; exit}' k8s/jerney.yaml)
          [ -n "$FRONTEND_LINE" ] || { echo "❌ frontend image line not found"; exit 1; }
          echo "Frontend image at line: ${FRONTEND_LINE}"
          sed -i "${FRONTEND_LINE}s|.*|          image: ${FRONTEND_IMAGE}:${IMAGE_TAG}|" k8s/jerney.yaml

          echo "✅ Updated images to tag: ${IMAGE_TAG}"
          grep -n "image:" k8s/jerney.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/jerney.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "ci: update k8s images to ${{ steps.vars.outputs.tag }} [skip ci]"
          git pull --rebase origin devops
          git push origin HEAD:devops
