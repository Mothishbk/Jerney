# ==============================================================
# Jerney - DevSecOps CI Pipeline (report-only security scans)
# ==============================================================
# Every scanner REPORTS instead of failing: findings are saved as
# JSON and uploaded as artifacts, and the pipeline keeps going.
# Only real breakage (npm ci, docker build/push) fails a job.
#
# Flow:
#   1. Secret Scan (Gitleaks)            -> gitleaks-report (SARIF/JSON)
#   2. Lint (ESLint)                     -> eslint-<component>.json
#   3. SAST (SonarQube)                  -> sonarqube-report (issues + gate JSON)
#   4. SCA (npm audit + Trivy fs)        -> sca-<component> (2 JSON files)
#   5. Dockerfile Lint (Hadolint)        -> hadolint-<component>.json
#   6. IaC Scan (Checkov TF + K8s)       -> checkov-report (JSON)
#   7. Build, Push, SBOM, Sign (Cosign)
#   8. Image Scan (Dockle + Trivy)       -> image-scan-<component> (2 JSON files)
#   9. Update K8s Manifest (devops branch only)
#
# Reports: Actions -> open a run -> "Artifacts" section at the bottom.
#
# Required repo secrets:
#   SONAR_TOKEN      - SonarQube token
#   SONAR_HOST_URL   - e.g. http://<sonarqube-ip>:9000
# GITHUB_TOKEN is provided automatically.
# ==============================================================

name: Jerney DevSecOps Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  SONAR_PROJECT_KEY: "Jerney-app"

jobs:
  # ==============================================================
  # STAGE 1: Secret Scanning (Gitleaks)
  # ==============================================================
  secret-scan:
    name: "🔑 Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # report only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false # we upload it ourselves below

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: warn

  # ==============================================================
  # STAGE 2: Linting (ESLint)
  # ==============================================================
  lint:
    name: "🔍 Lint ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run ESLint (JSON report)
        working-directory: ${{ matrix.component }}
        run: npm run lint -- --format json --output-file ../eslint-${{ matrix.component }}.json || true

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-${{ matrix.component }}
          path: eslint-${{ matrix.component }}.json
          if-no-files-found: warn

  # ==============================================================
  # STAGE 3: SAST (SonarQube)
  # ==============================================================
  sast-sonarqube:
    name: "🧪 SAST (SonarQube)"
    runs-on: ubuntu-latest
    needs: secret-scan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        continue-on-error: true # a failed quality gate is reported, not blocking
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend,frontend
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Export SonarQube results as JSON
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mkdir -p sonarqube-report
          curl -s -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}" \
            -o sonarqube-report/quality-gate.json || true
          curl -s -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&resolved=false&ps=500" \
            -o sonarqube-report/issues.json || true
          curl -s -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/hotspots/search?projectKey=${SONAR_PROJECT_KEY}&ps=500" \
            -o sonarqube-report/hotspots.json || true

      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: sonarqube-report/
          if-no-files-found: warn

  # ==============================================================
  # STAGE 4: SCA (npm audit + Trivy filesystem)
  # ==============================================================
  sca:
    name: "🛡️ SCA ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: npm audit (JSON report)
        working-directory: ${{ matrix.component }}
        run: npm audit --json > ../npm-audit-${{ matrix.component }}.json || true

      - name: Trivy filesystem scan (JSON report)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./${{ matrix.component }}"
          scanners: "vuln,secret"
          format: "json"
          output: "trivy-fs-${{ matrix.component }}.json"
          exit-code: "0" # report only
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-${{ matrix.component }}
          path: |
            npm-audit-${{ matrix.component }}.json
            trivy-fs-${{ matrix.component }}.json
          if-no-files-found: warn

  # ==============================================================
  # STAGE 5: Dockerfile Lint (Hadolint)
  # ==============================================================
  dockerfile-lint:
    name: "📋 Hadolint ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint (JSON report)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          format: json
          output-file: hadolint-${{ matrix.component }}.json
          no-fail: true # report only

      - name: Upload Hadolint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-${{ matrix.component }}
          path: hadolint-${{ matrix.component }}.json
          if-no-files-found: warn

  # ==============================================================
  # STAGE 6: IaC Security Scan (Checkov) — Terraform + K8s
  # ==============================================================
  iac-scan:
    name: "🏗️ IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install --quiet checkov

      - name: Checkov on Terraform (JSON report)
        # CKV_AWS_39, CKV_AWS_58: public EKS endpoint (intentional for dev)
        run: |
          checkov -d terraform/ --framework terraform \
            --skip-check CKV_AWS_39,CKV_AWS_58 \
            --output cli --output json --output-file-path checkov-report/terraform \
            --soft-fail --compact

      - name: Checkov on Kubernetes manifests (JSON report)
        run: |
          checkov -d k8s/ --framework kubernetes \
            --output cli --output json --output-file-path checkov-report/kubernetes \
            --soft-fail --compact

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report/
          if-no-files-found: warn

  # ==============================================================
  # STAGE 7: Build & Push Images (+ SBOM, provenance, signing)
  # ==============================================================
  build:
    name: "🐳 Build ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: [sca, sast-sonarqube, dockerfile-lint, iac-scan]
    # Runs unless something truly broke; still runs if SonarQube was skipped (fork PRs)
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless Cosign signing
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: true
          sbom: true

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, by digest)
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/jerney-${{ matrix.component }}"
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  # ==============================================================
  # STAGE 8: Image Scanning (Dockle + Trivy)
  # ==============================================================
  image-scan:
    name: "🔬 Image Scan ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=jerney-${{ matrix.component }}:scan" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/jerney-${{ matrix.component }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning (PR only)
        if: github.event_name == 'pull_request'
        run: docker build -t ${{ steps.ref.outputs.image }} ./${{ matrix.component }}

      - name: Pull pushed image (push only)
        if: github.event_name != 'pull_request'
        run: docker pull ${{ steps.ref.outputs.image }}

      - name: Dockle CIS benchmark (JSON report)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/out \
            goodwithtech/dockle:v0.4.15 \
            --format json --output /out/dockle-${{ matrix.component }}.json \
            --exit-code 0 \
            ${{ steps.ref.outputs.image }} || true

      - name: Trivy image scan (JSON report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: "json"
          output: "trivy-image-${{ matrix.component }}.json"
          exit-code: "0" # report only
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM"
          timeout: "10m"

      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-${{ matrix.component }}
          path: |
            dockle-${{ matrix.component }}.json
            trivy-image-${{ matrix.component }}.json
          if-no-files-found: warn

  # ==============================================================
  # STAGE 9: Update K8s Manifest (GitOps hand-off, devops branch only)
  # ==============================================================
  update-manifest:
    name: "🚀 Update K8s Manifest"
    runs-on: ubuntu-latest
    needs: [build, image-scan]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/devops' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag and names
        id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Update K8s manifest with new image tags
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          BACKEND_IMAGE: ${{ steps.vars.outputs.prefix }}/jerney-backend
          FRONTEND_IMAGE: ${{ steps.vars.outputs.prefix }}/jerney-frontend
        run: |
          set -euo pipefail

          BACKEND_LINE=$(awk '/- name: backend/{found=1} found && /image:/{print NR; exit}' k8s/jerney.yaml)
          [ -n "$BACKEND_LINE" ] || { echo "❌ backend image line not found"; exit 1; }
          sed -i "${BACKEND_LINE}s|.*|          image: ${BACKEND_IMAGE}:${IMAGE_TAG}|" k8s/jerney.yaml

          FRONTEND_LINE=$(awk '/- name: frontend/{found=1} found && /image:/{print NR; exit}' k8s/jerney.yaml)
          [ -n "$FRONTEND_LINE" ] || { echo "❌ frontend image line not found"; exit 1; }
          sed -i "${FRONTEND_LINE}s|.*|          image: ${FRONTEND_IMAGE}:${IMAGE_TAG}|" k8s/jerney.yaml

          echo "✅ Updated images to tag: ${IMAGE_TAG}"
          grep -n "image:" k8s/jerney.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/jerney.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "ci: update k8s images to ${{ steps.vars.outputs.tag }} [skip ci]"
          git pull --rebase origin devops
          git push origin HEAD:devops
