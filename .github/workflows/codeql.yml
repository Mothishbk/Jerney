name: CodeQL
on:
  push:
    branches: [devops]          # ← scan devops, not main
  pull_request:
    branches: [devops]          # ← PRs targeting devops
  schedule:
    - cron: "30 2 * * 1"        # optional weekly deep scan (Mon 02:30 UTC)

permissions:
  contents: read
  security-events: write        # publish results to the Security tab
  actions: read

jobs:
  analyze:
    name: "🧬 CodeQL SAST"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]   # covers backend + frontend
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
